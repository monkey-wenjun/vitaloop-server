services:
  vitaloop-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitaloop-server:vitaloop
    container_name: vitaloop-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8793:8793"
    volumes:
      - vitaloop-data:/data

volumes:
  # 从旧的 vitaloop-sync 容器沿用同一份数据卷，切换时不需要搬数据。
  vitaloop-data:
    external: true
