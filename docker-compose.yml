services:
  vitaloop-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitaloop-server:latest
    container_name: vitaloop-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8793:8793"
    volumes:
      - vitaloop-data:/data
    # 博客只读账号（VITALOOP_BLOG_TOKEN / VITALOOP_BLOG_ACCOUNT_ID）放在本机
    # 0600 的 blog.env 里，不进仓库。重建容器时靠 env_file 恢复，避免只读接口又变 401。
    # 不需要博客只读接入时，可以不建这个文件，或删掉下面一行。
    env_file:
      - ./blog.env
      # 私有部署的星历 CDN 地址等只放本机 0600 文件，不进仓库。
      # 文件不存在时跳过（Compose v2.24+ 支持 required）。
      - path: ./deploy.env
        required: false
    environment:
      # 反向代理的对外地址；不设则按请求 Host 头推断。
      # PUBLIC_BASE_URL: https://example.com
      # {date} 由服务启动时解析成最近可用的 Protomaps 构建。
      PMTILES_URL: https://build.protomaps.com/{date}.pmtiles

volumes:
  vitaloop-data:
